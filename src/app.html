<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Runs before paint: mark JS available and apply a saved theme choice
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				try {
					var t = localStorage.getItem('theme');
					if (t === 'light' || t === 'dark') d.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Geist-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
